
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adapter Pattern - Temperature Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px #0002;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Temperature Converter</h2>

    <p>Adapter Design Pattern</p>

    <label>Enter Temperature in Fahrenheit:</label>

    <input type="number" id="fahrenheit"
           placeholder="Enter Fahrenheit value">

    <br>

    <button onclick="convertTemperature()">
        Convert to Celsius
    </button>

    <div id="output"></div>

</div>

<script>

// STEP 1: Existing Fahrenheit sensor
class FahrenheitSensor {

    constructor(value) {
        this.value = value;
    }

    getFahrenheit() {
        return this.value;
    }
}

// STEP 2: Target interface expected by the application
class CelsiusProvider {

    getCelsius() {
        throw new Error("Method must be implemented");
    }
}

// STEP 3: Adapter converts Fahrenheit into Celsius
class TemperatureAdapter extends CelsiusProvider {

    constructor(sensor) {
        super();
        this.sensor = sensor;
    }

    getCelsius() {

        let fahrenheit = this.sensor.getFahrenheit();

        let celsius = (fahrenheit - 32) * 5 / 9;

        return celsius;
    }
}

// STEP 4: Convert temperature
function convertTemperature() {

    let value = document.getElementById("fahrenheit").value;

    let output = document.getElementById("output");

    if (value.trim() === "") {
        output.innerHTML = "Please enter a temperature!";
        return;
    }

    let fahrenheit = Number(value);

    // Create existing Fahrenheit sensor
    let sensor = new FahrenheitSensor(fahrenheit);

    // Create Adapter
    let adapter = new TemperatureAdapter(sensor);

    // Application accesses temperature in Celsius
    let celsius = adapter.getCelsius();

    output.innerHTML =
        fahrenheit + "°F = " + celsius.toFixed(2) + "°C";
}

</script>

</body>
</html>
